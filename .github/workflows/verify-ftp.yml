name: Verify FTP deployed content
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deployed index.html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import os, ftplib, io
          ftp=ftplib.FTP(os.environ['FTP_HOST'], timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASS'])
          ftp.cwd('/public_html')
          data=io.BytesIO()
          ftp.retrbinary('RETR index.html', data.write)
          ftp.quit()
          html=data.getvalue().decode('utf-8','replace')
          print('HAS_TEST:', 'across the world' in html)
          import re
          m=re.search(r'Proudly teaching students online across[^<]*', html)
          print('HEADING:', repr(m.group(0)) if m else 'NOT_FOUND')
          print('LEN:', len(html))
