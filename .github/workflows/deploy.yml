name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Normalize FTP host (strip ftp:// and any path)
        id: ftp
        run: |
          RAW="${{ secrets.FTP_HOST }}"
          HOST=$(echo "$RAW" | sed 's#^ftp://##; s#^ftps://##; s#/.*##')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: FTP upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/**
            **/.DS_Store
